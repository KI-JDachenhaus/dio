[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "dio"
version = "0.1.0"
description = "Ask Claude typed questions and get answers with probability distributions"
requires-python = ">=3.10"

[project.scripts]
dio = "dio:main"

[dependency-groups]
dev = ["ruff>=0.17"]

[tool.setuptools]
py-modules = ["dio"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
extend-select = ["I", "UP", "B"]  # import order, modern syntax for the target Python, likely bugs
